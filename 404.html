<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Durban Web Studio</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <!-- The styles are inside this page on purpose, so it still looks right
       whichever folder the visitor was in when the error happened. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #12263A;
      color: #F2F7F6;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 44px; line-height: 1.1; }
    p { margin: 0 0 28px; color: #A9BDC9; }
    a {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 50px;
      background: #F0B44C;
      color: #12263A;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #F6C874; }
  </style>
</head>
<body>
  <!-- SECTION: the message shown when a page cannot be found -->
  <main>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a href="/">Go to the home page</a>
  </main>
</body>
</html>
